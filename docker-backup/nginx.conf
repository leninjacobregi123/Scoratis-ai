server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Direct backend access (for streaming, etc.)
    location /chat {
        proxy_pass http://backend:8000/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header X-Accel-Buffering 'no';
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    location /journals {
        proxy_pass http://backend:8000/journals;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /folders {
        proxy_pass http://backend:8000/folders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
    }

    location /stats {
        proxy_pass http://backend:8000/stats;
        proxy_http_version 1.1;
    }

    location /videos/ {
        proxy_pass http://backend:8000/videos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /generated_videos/ {
        proxy_pass http://backend:8000/generated_videos/;
        proxy_http_version 1.1;
    }

    location /llm/ {
        proxy_pass http://backend:8000/llm/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location /subjects {
        proxy_pass http://backend:8000/subjects;
        proxy_http_version 1.1;
    }

    location /rag/ {
        proxy_pass http://backend:8000/rag/;
        proxy_http_version 1.1;
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
