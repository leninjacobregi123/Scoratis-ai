[pytest]
# Pytest configuration for Scoratis backend tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode - pytest-asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage settings (reduced threshold for initial setup)
addopts =
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database/services)
    evaluation: Agent evaluation tests (require LLM)
    slow: Slow tests (skip with -m "not slow")
    asyncio: Async tests

# Logging
log_cli = true
log_cli_level = INFO

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestUnraisableExceptionWarning
