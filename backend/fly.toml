# Fly.io app config for the Scoratis backend - runs both the FastAPI API and
# the Celery worker (video rendering, ingestion) from the one image built by
# backend/Dockerfile, using Fly's per-process VM groups.
#
# Deploy from this directory: `fly launch` (first time) or `fly deploy`.
# Secrets (never put these in [env]): fly secrets set DATABASE_URL=... REDIS_URL=...
#   JWT_SECRET_KEY=... SCORATIS_ENCRYPTION_KEY=... SCORATIS_ENCRYPTION_SALT=...
#   GROQ_API_KEY=... (or whichever cloud LLM provider key DEFAULT_LLM_PROVIDER needs)

app = "scoratis-backend"
primary_region = "iad"

[build]

[env]
  ENVIRONMENT = "production"

[processes]
  api = "uvicorn main:app --host 0.0.0.0 --port 8000"
  worker = "celery -A celery_app worker -Q default,ingestion,video --concurrency=2"

[deploy]
  release_command = "python scripts/run_migrations.py upgrade"

[[services]]
  processes = ["api"]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  # Manim rendering is memory-hungry - give the worker more headroom than the API.
  memory_mb = 2048
