name: CI - Test & Lint

on:
  push:
    branches: [main, socratis-v2, develop]
  pull_request:
    branches: [main, socratis-v2]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # =============================================================================
  # Backend Tests
  # =============================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scoratis
          POSTGRES_PASSWORD: scoratis_password
          POSTGRES_DB: scoratis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite  # For test database

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
          DATABASE_URL_ASYNC: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
          LANGCHAIN_TRACING_V2: "false"
        run: |
          pytest tests/unit -v -m unit --tb=short --cov=. --cov-report=xml

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://scoratis:scoratis_password@localhost:5432/scoratis_test
          DATABASE_URL_ASYNC: postgresql+asyncpg://scoratis:scoratis_password@localhost:5432/scoratis_test
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
          LANGCHAIN_TRACING_V2: "false"
        run: |
          pytest tests/integration -v -m integration --tb=short

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

  # =============================================================================
  # Backend Linting
  # =============================================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff linter
        working-directory: backend
        run: |
          ruff check . --output-format=github || true
        continue-on-error: true

      - name: Run Ruff formatter check
        working-directory: backend
        run: |
          ruff format --check . || true
        continue-on-error: true

  # =============================================================================
  # Frontend Tests
  # =============================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint || true
        continue-on-error: true

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: true

  # =============================================================================
  # Docker Build Test
  # =============================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: scoratis-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: scoratis-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Security Scan
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # Don't fail on vulnerabilities
        continue-on-error: true

  # =============================================================================
  # Summary Job
  # =============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-lint, frontend-tests, docker-build]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.backend-tests.result }}" == "failure" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.frontend-tests.result }}" == "failure" ]; then
            echo "Frontend tests failed"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" == "failure" ]; then
            echo "Docker build failed"
            exit 1
          fi
          echo "All CI checks passed!"
