name: Ops - Stop/Start Production Stack

# On-demand stack control for the production VM - stop the app (e.g. while
# making major changes that shouldn't be live), or start it back up without
# a full rebuild. Reuses the same deploy-key secrets as cd.yml. Manual
# trigger only - never runs automatically.
#
# Only targets backend/frontend/worker - postgres, redis, and caddy are
# deliberately left running. Caddy stays up so it can serve the branded
# maintenance page (see Caddyfile's handle_errors) instead of the app going
# fully unreachable, and postgres/redis staying up means "start" is fast
# and no data is ever at risk either way.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "stop (take the app offline) or start (bring it back up)"
        required: true
        type: choice
        options:
          - stop
          - start

jobs:
  control:
    name: ${{ github.event.inputs.action }} production stack
    runs-on: ubuntu-latest

    steps:
      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run docker compose ${{ github.event.inputs.action }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "cd ~/scoratis-deploy && sudo docker compose --env-file .env.production -f docker-compose.prod.yml ${{ github.event.inputs.action }} backend frontend worker"

      - name: Show container status
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo docker compose -f ~/scoratis-deploy/docker-compose.prod.yml ps"
