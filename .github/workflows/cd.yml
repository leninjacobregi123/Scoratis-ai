name: CD - Deploy

# Single-environment deploy: one Azure VM running the whole app via
# docker-compose.prod.yml (postgres, redis, backend, worker, frontend,
# caddy - see that file's own comments for why). Mirrors exactly the manual
# deploy flow this was built and verified against: rsync the repo to the
# VM, then run the one command that builds and restarts everything.
#
# The previous version of this workflow built images and pushed them to
# GHCR with staging/production/release jobs targeting placeholder domains
# that were never real - none of it had ever actually run, since it
# triggered on `main`/version tags while this repo's default branch is
# `master`. Replaced with what's actually deployed and verified working.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to production VM
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scoratis-app.centralindia.cloudapp.azure.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repo to VM
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude 'backend/.venv' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/uploads' \
            --exclude 'backend/generated_videos' \
            --exclude 'backend/audio_cache' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'frontend/dist' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'node_modules' \
            --exclude '.env.production' \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/scoratis-deploy/

      - name: Build and restart the stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "cd ~/scoratis-deploy && sudo docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 20); do
            status=$(curl -sk -o /dev/null -w '%{http_code}' https://${{ secrets.VM_HOST_DNS || 'scoratis-app.centralindia.cloudapp.azure.com' }}/health || echo 000)
            if [ "$status" = "200" ]; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i, status $status)"
            sleep 10
          done
          echo "Backend did not become healthy in time"
          exit 1

      - name: Show final container status
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo docker compose -f ~/scoratis-deploy/docker-compose.prod.yml ps"
