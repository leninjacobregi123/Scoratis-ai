# Scoratis - Development Docker Compose
# Only PostgreSQL and Redis - Frontend/Backend run locally

services:
  # PostgreSQL with pgvector for RAG
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scoratis-postgres
    environment:
      POSTGRES_USER: scoratis
      POSTGRES_PASSWORD: scoratis_password
      POSTGRES_DB: scoratis
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoratis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for Celery task queue and caching
  redis:
    image: redis:7-alpine
    container_name: scoratis-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
