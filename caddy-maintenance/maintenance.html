<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Scoratis - Temporarily Unavailable</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #f5f0e6;
    color: #4a5a40;
    font-family: Georgia, 'Times New Roman', serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: #faf6ed;
    border: 1px solid #d4cfb8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }
  h1 {
    font-style: italic;
    font-weight: 400;
    font-size: 30px;
    margin: 0 0 12px;
    color: #4a5a40;
  }
  .divider {
    width: 48px;
    height: 1px;
    background: #d4cfb8;
    margin: 0 auto 20px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #6b7c5e;
    margin: 0 0 8px;
  }
  .quote {
    font-style: italic;
    font-size: 14px;
    color: #a0a090;
    margin-top: 24px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #a0a090;
    border: 1px solid #d4cfb8;
    border-radius: 999px;
    padding: 6px 16px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #b8860b;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">&#127963;&#65039;</div>
    <h1>Scoratis</h1>
    <div class="divider"></div>
    <p>We're currently making improvements behind the scenes.</p>
    <p>Please check back shortly - we won't be long.</p>
    <p class="quote">"The unexamined life is not worth living."</p>
    <div class="badge"><span class="dot"></span>Temporarily offline for updates</div>
  </div>
</body>
</html>
