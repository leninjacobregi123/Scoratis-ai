[pytest]
# Pytest configuration for Scoratis AI Testing Suite
# Location: testing_SAI/

# Test discovery - look in this directory
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode - pytest-asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies, ~100ms)
    integration: Integration tests (require database/services, ~1-5s)
    evaluation: Agent evaluation tests (require LLM, slow)
    e2e: End-to-end tests (full workflow, slowest)
    slow: Slow tests (skip with -m "not slow")
    asyncio: Async tests
    smoke: Quick smoke tests for CI
    rag: RAG-related tests
    agent: Agent-related tests
    tools: Tool-related tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Timeout for individual tests (requires pytest-timeout)
# timeout = 60

# Coverage settings (requires pytest-cov)
# Run with: pytest --cov=backend/services --cov-report=html
